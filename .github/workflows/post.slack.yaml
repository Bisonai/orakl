name: Post to a Slack channel

on:
  workflow_call:
    inputs:
      slack-message:
        required: true
        type: string
      status:
        required: true
        type: string
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      SLACK_CHANNEL_ID:
        required: true

jobs:
  post-to-slack:
    name: Post a message to a Slack channel
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      contents: read

    steps:
      # Channel comes from a secret (masked in logs) and goes into a file, not a step output.
      - name: Set Slack Payload
        env:
          CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
          STATUS: ${{ inputs.status }}
          MESSAGE: ${{ inputs.slack-message }}
        run: |
          if [ "$STATUS" == "Success" ]; then
            icon=":white_check_mark:"; color="28a745"
          else
            icon=":exclamation:"; color="E96D76"
          fi
          jq -n --arg channel "$CHANNEL" --arg text "$icon $MESSAGE" --arg color "$color" --arg status "$STATUS" \
            '{channel: $channel, text: $text, attachments: [{color: $color, fields: [{title: "Status", short: true, value: $status}]}]}' \
            > "$RUNNER_TEMP/slack-payload.json"

      - name: Post to a Slack channel
        id: slack
        uses: slackapi/slack-github-action@v4.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload-file-path: ${{ runner.temp }}/slack-payload.json
