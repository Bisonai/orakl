name: "contracts: collect addresses"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "master"
    paths:
      - "contracts/v0.2/addresses/mainnet/**"
      - "contracts/v0.2/addresses/kairos/**"
      - "contracts/v0.2/script/collect-addresses.cjs"

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect addresses
        working-directory: contracts/v0.2
        run: node ./script/collect-addresses.cjs
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/collect-addresses
          delete-branch: true
          add-paths: |
            contracts/v0.2/addresses/datafeeds-addresses.json
            contracts/v0.2/addresses/others-addresses.json
          commit-message: "chore: regenerate datafeeds/others addresses"
          title: "chore: regenerate datafeeds/others addresses"
          body: |
            Generated by `node ./script/collect-addresses.cjs` from `contracts/v0.2/addresses/{mainnet,kairos}` and `https://config.orakl.network/<chain>_feeds.json`.
