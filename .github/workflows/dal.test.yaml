name: "miko dal test"

on:
  push:
    branches-ignore:
      - "master"
    paths:
      - "node/pkg/dal/**"
      - "node/cmd/dal/**"
  workflow_dispatch:

jobs:
  core-build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          check-latest: true
          cache-dependency-path: |
            ./node/go.sum

      - name: Install dependencies
        run: |
          cd ./node
          go mod tidy

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run test
        run: |
          cd ./node
          task local:test-dal
        env:
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          KAIA_PROVIDER_URL: "https://public-en-kairos.node.kaia.io"
          KAIA_WEBSOCKET_URL: "wss://public-en-kairos.node.kaia.io/ws"
          SUBMISSION_PROXY_CONTRACT: "0x35bA1102A4954147272782302856BD8440227B85"
          SIGNER_PK: ${{ secrets.TEST_DELEGATOR_REPORTER_PK}}
          API_KEY: "MikoTestApiKey"
