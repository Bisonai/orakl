name: "miko reporter test"

on:
  push:
    branches-ignore:
      - "master"
    paths:
      - "node/pkg/reporter/**"
      - "node/cmd/reporter/**"
  workflow_dispatch:

jobs:
  core-build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          check-latest: true
          cache-dependency-path: |
            ./node/go.sum

      - name: Install dependencies
        run: |
          cd ./node
          go mod tidy

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run test
        run: |
          cd ./node
          task local:test-reporter
        env:
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          KAIA_WEBSOCKET_URL: "wss://public-en-kairos.node.kaia.io/ws"
          KAIA_PROVIDER_URL: "https://public-en-kairos.node.kaia.io"
          KAIA_REPORTER_PK: ${{ secrets.TEST_DELEGATOR_REPORTER_PK}}
          SUBMISSION_PROXY_CONTRACT: "0xE2bA32d006e6FEd86AeA2502C561540c28CF65e9"
          CHAIN: "test"
          SIGNER_PK: ${{ secrets.TEST_DELEGATOR_REPORTER_PK}}
          API_KEY: ${{ secrets.DAL_API_KEY}}
          DAL_REST_URL: "https://dal.kairos.orakl.network"
          DAL_WS_URL: "ws://dal.kairos.orakl.network/ws"
