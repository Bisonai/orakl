name: "miko delegator test"

on:
  push:
    branches-ignore:
      - "master"
    paths:
      - "node/pkg/delegator/**"
      - "node/cmd/delegator/**"
  workflow_dispatch:

jobs:
  core-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          check-latest: true
          cache-dependency-path: |
            ./node/go.sum
      - name: Install dependencies
        run: |
          cd ./node
          go mod tidy
      - name: Run test
        run: |
          cd ./node/pkg/delegator
          go test ./... -v
