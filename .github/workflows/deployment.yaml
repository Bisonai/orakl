name: Kairos Deploy Existing Image

# Points kairos at an already-built image (rollback / redeploy). No build, no commit to master.
# New images: push tag <service>/vX.Y.Z (tag+deploy.yaml). Mainnet: Promote workflow.

on:
  workflow_dispatch:
    inputs:
      application:
        description: "Service"
        required: true
        type: choice
        options:
          - "cli"
          - "vrf"
          - "api"
          - "request-response"
          - "delegator"
          - "por"
          - "node"
          - "boot-api"
          - "sentinel"
          - "dal"
          - "reporter"
      image-tag:
        description: "Existing ECR image tag (e.g. v0.0.26.20261030.0534.abc1234)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.split.outputs.version }}
      tag_date: ${{ steps.split.outputs.tag_date }}
      tag_git_hash: ${{ steps.split.outputs.tag_git_hash }}

    steps:
      - name: validate and split image tag
        id: split
        env:
          APP: ${{ inputs.application }}
          IMG_TAG: ${{ inputs.image-tag }}
        run: |
          if [[ ! $IMG_TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]{8}\.[0-9]{4})\.([0-9a-f]{7,})(\.[a-z]+)?$ ]]; then
            echo "Image tag does not match v<X.Y.Z>.<date>.<time>.<hash>[.<suffix>]: $IMG_TAG"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          echo "tag_date=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          echo "tag_git_hash=${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT

          service="$APP"
          if [[ "$service" == "vrf" || "$service" == "request-response" ]]; then
            service="core"
          fi
          image="public.ecr.aws/bisonai/orakl-${service}:${IMG_TAG}"
          if ! docker manifest inspect "$image" > /dev/null; then
            echo "Image not found: $image"
            exit 1
          fi

  image-update:
    name: Update image tag
    needs: prepare
    uses: ./.github/workflows/update.image-tag.yaml
    with:
      network: "baobab"
      build: false
      project-name: ${{ inputs.application }}
      version: ${{ needs.prepare.outputs.version }}
      image-tag: ${{ inputs.image-tag }}
      tag_date: ${{ needs.prepare.outputs.tag_date }}
      tag_git_hash: ${{ needs.prepare.outputs.tag_git_hash }}
    secrets:
      GH_ORAKL_BOT_APP_ID: ${{ secrets.GH_ORAKL_BOT_APP_ID }}
      GH_ORAKL_BOT_PRIVATE_KEY: ${{ secrets.GH_ORAKL_BOT_PRIVATE_KEY }}

  post-slack-success:
    name: Post slack message for tag update success
    needs: image-update
    uses: ./.github/workflows/post.slack.yaml
    if: ${{ success() }}
    with:
      status: "Success"
      slack-message: "Kairos *${{ inputs.application }}* set to ${{ inputs.image-tag }}"
      channel: "miko-notification"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  post-slack-failure:
    name: Post slack message for tag update failure
    needs: [prepare, image-update]
    uses: ./.github/workflows/post.slack.yaml
    if: ${{ failure() }}
    with:
      status: "Failed"
      slack-message: "Kairos *${{ inputs.application }}* deploy of ${{ inputs.image-tag }} failed"
      channel: "miko-notification"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
